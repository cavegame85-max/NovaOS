[greeter]
background=/usr/share/backgrounds/novaos-default.jpg
theme-name=Arc-Dark
icon-theme-name=Papirus-Dark
font-name=Inter 10
xft-antialias=true
xft-dpi=96
xft-hintstyle=hintslight
xft-rgba=rgb
indicators=~host;~spacer;~clock;~spacer;~session;~power
clock-format=%H:%M  %d.%m.%Y
position=50%,center
user-background=true
